[package]
name = "huh-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A Rust port of Huh (charm.land/huh/v2), interactive forms and prompts for the terminal."
license = "MIT"
repository = "local"

[dependencies]
bubbletea-rs = { path = "../bubbletea-rs" }
lipgloss-rs  = { path = "../lipgloss-rs" }
bubbles-rs   = { path = "../bubbles-rs" }
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "multi_group"
path = "examples/multi_group.rs"

[[example]]
name = "multiselect"
path = "examples/multiselect.rs"
